gui:
  nerdFontsVersion: "3"
  showFileTree: true
  sidePanelWidth: 0.25
  mainPanelSplitMode: flexible
  wrapLinesInDiffView: true
  useHunkModeInDiffView: true
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true
git:
  autoFetch: true
  autoRefresh: true
  autoForwardBranches: onlyMainBranches
  fetchAll: true
  autoStageResolvedConflicts: true
  diffContextSize: 3
  diffRenderers:
    - command: >-
        delta --paging=never --side-by-side --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      colorArg: always
customCommands:
  - key: "f"
    command: "git difftool -y {{ .SelectedCommit.Hash }} -- {{ .SelectedCommitFile.Name | quote }}"
    context: "commitFiles"
    description: "Compare selected commit file with working copy"
    output: terminal
os:
  editPreset: nvim
disableStartupPopups: true
confirmOnQuit: true
